# The build is Hugo-only. The TinaCMS admin is still in the repo (tina/,
# package.json) but is NOT built in CI — `tinacms build` requires a TINA_TOKEN
# from Tina Cloud, and without it the whole deploy fails before Hugo ever runs.
# To turn the CMS back on: set TINA_TOKEN in the Netlify dashboard (Site
# settings -> Environment) and restore the `npx tinacms build && ` prefix on the
# build commands below.

[build]
publish = "public"
command = "hugo --gc --minify"

# Kept for when the Tina build is re-enabled. The client ID is a PUBLIC value
# (it ships to the browser), so it's safe to commit here. The secret TINA_TOKEN
# must NOT go in this file — set it in the Netlify dashboard.
[build.environment]
NEXT_PUBLIC_TINA_CLIENT_ID = "d03ad52a-fe74-468f-81ea-82c754d30b99"
TINA_BRANCH = "master"

[context.production.environment]
HUGO_VERSION = "0.163.1"
NODE_VERSION = "22"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.163.1"
NODE_VERSION = "22"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.163.1"
NODE_VERSION = "22"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.163.1"
NODE_VERSION = "22"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

# NOTE: Security + caching headers now live in static/_headers so they apply on
# both Netlify and Cloudflare Pages. Do not re-add [[headers]] blocks here.
