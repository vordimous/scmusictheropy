<div class="block-item-cta">
  {{ range $action := .actions }}
  {{ $url := $action.url }}
  {{ if eq $url "#next-meeting" }}{{ $url = partial "next_meeting.html" $ }}{{ end }}
  <a href="{{ $url | relURL }}">{{ $action.label }} <span class="icon-arrow-right" aria-hidden="true"></span></a>
  {{ end }}
</div>
